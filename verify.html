<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLYMPUSX | VERIFICATION</title>
    <style>
        :root { --main-red: #ff0000; --dark-bg: #050505; --neon-green: #39ff14; }
        body { 
            background: var(--dark-bg); color: #fff; font-family: 'Consolas', 'Courier New', monospace;
            margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh;
            background-image: linear-gradient(0deg, rgba(0,0,0,1) 0%, rgba(20,0,0,1) 100%);
        }
        .verify-card {
            width: 90%; max-width: 400px; padding: 40px; border: 1px solid var(--main-red);
            border-radius: 10px; background: rgba(0,0,0,0.9); box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
            position: relative; overflow: hidden;
        }
        .verify-card::before {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(255,0,0,0.05) 1px, rgba(255,0,0,0.05) 2px);
            pointer-events: none;
        }
        h1 { color: var(--main-red); font-size: 2em; letter-spacing: 5px; margin-bottom: 10px; text-shadow: 0 0 10px var(--main-red); }
        .status-text { font-size: 0.8em; color: #666; margin-bottom: 30px; text-transform: uppercase; }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        label { color: var(--main-red); font-size: 0.7em; letter-spacing: 2px; }
        input { 
            width: 100%; background: #000; border: 1px solid #333; color: var(--neon-green);
            padding: 15px; margin-top: 5px; border-radius: 5px; font-size: 1.1em; outline: none;
            box-sizing: border-box; transition: 0.3s;
        }
        input:focus { border-color: var(--main-red); box-shadow: 0 0 10px rgba(255,0,0,0.2); }

        .progress-container { margin: 25px 0; }
        .progress-text { font-size: 0.7em; display: flex; justify-content: space-between; margin-bottom: 5px; }
        .progress-bar { height: 6px; background: #111; border-radius: 10px; overflow: hidden; border: 1px solid #222; }
        .progress-fill { height: 100%; background: var(--main-red); width: 0%; transition: 0.5s; box-shadow: 0 0 10px var(--main-red); }

        .btn-action {
            width: 100%; padding: 18px; background: var(--main-red); color: #fff; border: none;
            font-weight: bold; cursor: pointer; border-radius: 5px; letter-spacing: 2px;
            text-transform: uppercase; transition: 0.3s;
        }
        .btn-action:hover { background: #b30000; transform: scale(1.02); }
        .btn-action:active { transform: scale(0.98); }

        .footer-note { font-size: 0.6em; color: #444; margin-top: 20px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="verify-card">
    <h1>OLYMPUSX</h1>
    <div class="status-text">VERIFY v4.0</div>

    <div class="input-group">
        <label>TARGET UID</label>
        <input type="text" id="target_uid" placeholder="ENTER 10-DIGIT UID...">
    </div>

    <div class="progress-container">
        <div class="progress-text">
            <span id="step-label">LINK Ads </span>
            <span id="step-count">0/3</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="bar"></div>
        </div>
    </div>

    <button class="btn-action" id="action-btn" onclick="processStep()">Execute Step 1</button>

    <div class="footer-note">
        WARNING: All activities are logged under OlympusX Private Infrastructure. 
        Complete all 3 bypass steps to inject data into core server.
    </div>
</div>

<script>
    let currentStep = 0;
    const totalSteps = 3;
    const fbURL = "https://olympusx-xmodz-default-rtdb.asia-southeast1.firebasedatabase.app/";
    const adLinks = [
        "https://discord.gg/astutetech",
        "https://discord.gg/J443CYrMkK",
        "https://discord.gg/3EGz8AqyeY",
    ];

    function processStep() {
        const uid = document.getElementById('target_uid').value;
        if(uid.length < 5) {
            alert("❌ UID INVALID: กรุณาระบุ UID ให้ถูกต้องก่อนเริ่มกระบวนการ");
            return;
        }

        if(currentStep < totalSteps) {
            window.open(adLinks[currentStep], '_blank');
            currentStep++;
            updateUI();
        } else {
            completeVerification(uid);
        }
    }

    function updateUI() {
        const bar = document.getElementById('bar');
        const count = document.getElementById('step-count');
        const btn = document.getElementById('action-btn');
        const label = document.getElementById('step-label');

        const percent = (currentStep / totalSteps) * 100;
        bar.style.width = percent + "%";
        count.innerText = `${currentStep}/${totalSteps}`;
        
        if(currentStep < totalSteps) {
            btn.innerText = `Execute Step ${currentStep + 1}`;
            label.innerText = "BYPASSING ENCRYPTION...";
        } else {
            btn.innerText = "FINALIZING INJECTION";
            btn.style.background = "#39ff14";
            btn.style.color = "#000";
            label.innerText = "VERIFICATION COMPLETE";
        }
    }

    async function completeVerification(uid) {
        document.getElementById('action-btn').innerText = "CONNECTING...";
        try {
            const data = {
                uid: uid,
                status: "active",
                vip: 0,
                diamonds: 0,
                rank: "BRONZE",
                verified_at: Date.now()
            };
            await fetch(`${fbURL}players/${uid}.json`, { method: 'PUT', body: JSON.stringify(data) });
            alert("⚡ SYSTEM: บันทึกข้อมูล UID " + uid + " สำเร็จ! กรุณาไปที่หน้า Dashboard");
            window.location.href = "dashboard.html";
        } catch(e) {
            alert("❌ ERROR: ไม่สามารถติดต่อฐานข้อมูลได้");
            document.getElementById('action-btn').innerText = "RETRY INJECTION";
        }
    }
</script>

</body>
    </html>
